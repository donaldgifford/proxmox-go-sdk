---
# $schema=https://www.schemastore.org/github-action.json
name: Changelog Drift Check
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          experimental: true
      - name: Generate fresh CHANGELOG
        run: |
          git fetch --tags --force origin
          git-cliff -o CHANGELOG.generated.md
      - name: Diff against committed CHANGELOG
        run: |-
          if ! diff -q CHANGELOG.md CHANGELOG.generated.md > /dev/null; then
            echo "::error::CHANGELOG.md is stale. Run 'git-cliff -o CHANGELOG.md' and commit."
            diff CHANGELOG.md CHANGELOG.generated.md || true
            exit 1
          fi
