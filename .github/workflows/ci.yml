---
# $schema=https://www.schemastore.org/github-action.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Label PR
    steps:
      - name: Run labeler
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up mise (for just)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      - name: Run unit tests
        run: just test

      - name: Check API schema drift
        run: just schemadiff

      # Fails on a stale docs/COVERAGE.md, on a mockpve route referencing an
      # endpoint real PVE does not serve, and on a stale annotation (DESIGN-0005).
      - name: Check API coverage report
        run: just coverage-check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: donaldgifford/proxmox-go-sdk
        continue-on-error: true

  test-replay:
    name: Test Replay (cassettes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up mise (for just)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      # Replays the committed go-vcr cassettes through the integration suite with
      # no live node, so every phase's SDK request paths are exercised in CI.
      - name: Replay recorded cassettes (no live node)
        run: just test-replay

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: donaldgifford/govulncheck-action@fa2076e80682e840c13c29cfa1e120995d932e5b # v1
        with:
          # The action defaults go-version-input to "stable", which setup-go
          # prefers over go-version-file; blank it so go.mod pins the scan.
          go-version-input: ""
          go-version-file: go.mod
          check-latest: false
          go-package: ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    name: Build (goreleaser snapshot)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # syft is required by the .goreleaser.yml sboms block, which catalogs the
      # mockpve helper archives. mise installs it (per mise.toml) onto PATH.
      - name: Set up mise (for syft)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      # This snapshot validates the .goreleaser.yml config end to end: it builds
      # the mockpve helper archives and SBOM-scans them with syft. Signing is
      # skipped — the signs block needs GPG_FINGERPRINT + a key, which are
      # release-only secrets absent from a PR snapshot.
      - name: Validate goreleaser config (snapshot)
        uses: goreleaser/goreleaser-action@e24998b8b67b290c2fa8b7c14fcfa7de2c5c9b8c # v7.1.0
        with:
          version: "~> v2"
          args: release --snapshot --skip=publish,sign --clean
